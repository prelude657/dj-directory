<header class="app-header">
  <div class="header-container">
    <a routerLink="/" class="app-title">The DJ Directory</a>
    
    <nav class="app-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      

      <ng-container *ngIf="authService.isLoggedIn(); else guestNav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link dashboard-link">
          🎧 DJ Dashboard
        </a>
        <button (click)="logout()" class="nav-btn logout-btn">Logout</button>
      </ng-container>

      <ng-template #guestNav>
        <a routerLink="/login" class="nav-btn login-btn">DJ Login</a>
        <a routerLink="/register" class="nav-btn join-btn">Join as DJ</a>
      </ng-template>
    </nav>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
